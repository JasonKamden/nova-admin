services:
  mysql:
    image: mysql:8.4.10
    container_name: nova-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in deploy/.env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nova_admin}
      TZ: Asia/Shanghai
    ports: [ "3306:3306" ]
    volumes:
      - mysql-data:/var/lib/mysql
      - ../sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../sql/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    command: [ "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci" ]
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD" ]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4
    container_name: nova-redis
    restart: unless-stopped
    command: [ "redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in deploy/.env}" ]
    ports: [ "6379:6379" ]
    volumes: [ "redis-data:/data" ]

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    container_name: nova-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in deploy/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in deploy/.env}
    command: server /data --console-address ":9001"
    ports: [ "9000:9000", "9001:9001" ]
    volumes: [ "minio-data:/data" ]

  backend:
    build:
      context: ..
      dockerfile: deploy/backend/Dockerfile
    image: nova-admin-backend:local
    container_name: nova-backend
    restart: unless-stopped
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_started }
      minio: { condition: service_started }
    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nova_admin}
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in deploy/.env}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in deploy/.env}
      STORAGE_TYPE: ${STORAGE_TYPE:-MINIO}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in deploy/.env}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in deploy/.env}
      MINIO_BUCKET: nova
      SERVER_PORT: 8080
    ports: [ "8080:8080" ]
    volumes:
      - backend-data:/app/data

volumes:
  mysql-data:
  redis-data:
  minio-data:
  backend-data:
