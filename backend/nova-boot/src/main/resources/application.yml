server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: nova-boot
  main:
    keep-alive: true
  threads:
    virtual:
      enabled: ${VIRTUAL_THREADS_ENABLED:false}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:nova_admin}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5s
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

mybatis-flex:
  configuration:
    map-underscore-to-camel-case: true

sa-token:
  token-name: Authorization
  timeout: ${TOKEN_TIMEOUT_SECONDS:2592000}
  active-timeout: ${TOKEN_ACTIVE_TIMEOUT_SECONDS:86400}
  is-read-header: true
  is-read-cookie: false
  is-share: false

storage:
  type: ${STORAGE_TYPE:LOCAL}
  local-dir: ${STORAGE_LOCAL_DIR:./data/storage}
  minio-endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
  minio-access-key: ${MINIO_ACCESS_KEY:minioadmin}
  minio-secret-key: ${MINIO_SECRET_KEY:minioadmin123}
  minio-bucket: ${MINIO_BUCKET:nova}
  max-file-size: ${STORAGE_MAX_FILE_SIZE:52428800}

excel:
  max-rows: ${EXCEL_MAX_ROWS:5000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    org.dromara.nova: INFO
  pattern:
    level: "%5p [${spring.application.name:},%X{requestId:-},%X{traceId:-}]"
